    </g>
  </g>

  <!-- Truss boundary only: y = +/-0.40, x=-4.7..2.1, z=-.6..1.9 -->
  <g fill="#eee9df" fill-opacity=".13" stroke="#78684c" stroke-width="1.2" stroke-dasharray="7 4">
