<text x="770" y="540" fill="#a0a" font-size="11">Streamer rod and pressure tube: position UNKNOWN (SCHEMATIC)</text>

<!-- labels -->
<g font-size="11" fill="#000">
<text x="880" y="210">Upper wing, z 1.80</text>
<text x="820" y="178" fill="#b05010">Port balancing flap, y −3.5 to −5.5</text>
<text x="170" y="430" fill="#b05010">Starboard flap</text>
<text x="690" y="570">Nacelle and seat, x −1.6 to 0.2</text>
<text x="660" y="400" fill="#1a3a8a">Seated operator, CM (−0.9, 0.3)</text>
<text x="600" y="396">Engine, radiator, fuel, 110 kg</text>
<text x="520" y="252">Screw, Ø 2.4 m, disc at x 2.1 (pusher)</text>
<text x="400" y="248">Shaft, x 0.3 to 2.0</text>
<text x="140" y="192">Fin and rudder, z 0.6 to 2.0</text>
<text x="120" y="378">Tailplane, x 4.5 to 5.6</text>
<text x="120" y="345" fill="#b05010">Elevator, x 5.6 to 6.1</text>
<text x="210" y="290">Tail booms, y ±1.4, 4 spars</text>
<text x="300" y="382">Tail skid, x 5.8</text>
<text x="420" y="640">Two ash skids, y ±0.9, z −0.9, with wheel pairs</text>
<text x="580" y="444" font-weight="bold">CM (0.66, 0.46)</text>
<text x="695" y="455" fill="#080">Thrust line, 0.44 m above CM</text>
<text x="470" y="300" fill="#d00">Red dashed: linkages, SCHEMATIC</text>
</g>
<line x1="470" y1="645" x2="540" y2="580" stroke="#666" stroke-width="0.6"/>

<!-- legend -->
<rect x="15" y="668" width="1170" height="222" fill="#fff" stroke="#444"/>
<text x="25" y="688" font-weight="bold" font-size="13">LEGEND</text>
<rect x="25" y="698" width="18" height="10" fill="#e8dcc0" stroke="#6b5530"/><text x="50" y="707">Fixed surfaces (wings, tailplane, fin)</text>
<rect x="25" y="716" width="18" height="10" fill="#f3c9a0" stroke="#b05010"/><text x="50" y="725">Hinged control surfaces (flaps, elevator, rudder)</text>
<line x1="25" y1="739" x2="43" y2="739" stroke="#d00" stroke-dasharray="4,3" stroke-width="1.5"/><text x="50" y="743">Control runs: wheel to flaps, lever to elevator, foot bar to rudder. Routing SCHEMATIC</text>
<line x1="25" y1="757" x2="43" y2="757" stroke="#357" stroke-dasharray="5,3"/><text x="50" y="761">Screw disc (swept circle)</text>
<line x1="25" y1="775" x2="43" y2="775" stroke="#080" stroke-dasharray="8,4"/><text x="50" y="779">Thrust line</text>
<circle cx="34" cy="793" r="5" fill="#fff" stroke="#000"/><text x="50" y="797">Whole-machine centre of mass, 340 kg (§4, [D])</text>
<text x="25" y="815" fill="#1a3a8a">Blue figure: operator seated upright, hand on the flap wheel, feet on the foot bar.</text>

<text x="560" y="688" font-weight="bold" fill="#a00">UNRESOLVED / SCHEMATIC ITEMS (not silently fixed)</text>
<g font-size="10.5" fill="#a00">
<text x="560" y="704">• 1° dihedral (§6) is absent from the §4 coordinates. Wings are drawn flat.</text>
<text x="560" y="719">• The shaft ends at x 2.0 but the disc is at x 2.1. The 0.1 m join is UNKNOWN.</text>
<text x="560" y="734">• The shaft-plus-screw mass centre (2.2, 0.9) lies aft of the disc itself.</text>
<text x="560" y="749">• The main skids reach z −0.9 but the tail skid only reaches z 0.0.</text>
<text x="572" y="762">Ground attitude is therefore contradictory. No ground line is drawn.</text>
<text x="560" y="777">• The elevator lever position is not specified: SCHEMATIC.</text>
<text x="560" y="792">• Radiator and fuel tank positions within the engine box are UNKNOWN.</text>
<text x="560" y="807">• Positions of the streamer rod and pressure gauge are UNKNOWN.</text>
<text x="560" y="822">• Throttle location is UNKNOWN (not shown). Wire bracing is shown only partly.</text>
<text x="560" y="837">• Wheel positions along the skids and skid-strut stations are not given: SCHEMATIC.</text>
<text x="560" y="852">• The disc's lower edge at z −0.3 is below the lower boom spar at z 0 (§10 flags this).</text>
<text x="560" y="867">• The §7 wheel sense is self-corrected in the text; it is not shown here.</text>
</g>
<text x="25" y="840" font-size="10.5">Projection: screen x = 600 − 45x − 50y; screen y = 480 − 85z − 20x + 20y.</text>
<text x="25" y="855" font-size="10.5">All values are from §4. Masses: operator 70, engine group 110, wings 80, tail 35, gear 25, shaft and screw 20 kg.</text>
<text x="25" y="870" font-size="10.5">Layout is possibly recalled from later machines [R], as stated in the article.</text>
</svg>