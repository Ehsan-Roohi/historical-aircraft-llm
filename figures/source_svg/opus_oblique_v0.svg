<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Arial,Helvetica,sans-serif" font-size="12">
<rect width="1200" height="900" fill="#fbfaf5"/>
<text x="20" y="28" font-size="18" font-weight="bold">Seated-operator tail-balanced biplane, 31 Dec 1898: oblique view from forward-starboard-above</text>
<text x="20" y="46" font-size="11">Parallel projection of the article's §4 coordinates (origin at lower-wing leading edge on the centreline; x aft, y starboard, z up; metres). Datum: wing chord horizontal.</text>

<!-- axes -->
