<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="sans-serif" font-size="13">
<rect width="1200" height="900" fill="#fbfaf5"/>
<text x="20" y="26" font-size="18" font-weight="bold">Fig. 4 — Oblique view (from ahead, left, above) of the two-deck screw-driven soaring apparatus, 1898 memorandum</text>
<g stroke="#333" stroke-width="1.5" fill="none">
<!-- tail plane, fin, rudder -->
<polygon points="812,642 902,677 1090,575 1000,540" fill="#d9e6f2"/>
<line x1="812" y1="642" x2="1000" y2="540" stroke-dasharray="4 3"/>
<polygon points="906,589 987,620 987,520 906,489" fill="#e8e8e8"/>
<polygon points="987,620 1068,652 1068,552 987,520" fill="#d9e6f2"/>
