<line x1="174" y1="663" x2="174" y2="492"/><line x1="300" y1="712" x2="300" y2="541"/>
<line x1="278" y1="606" x2="278" y2="435"/><line x1="404" y1="655" x2="404" y2="484"/>
<line x1="383" y1="549" x2="383" y2="378"/><line x1="509" y1="598" x2="509" y2="427"/>
<line x1="592" y1="435" x2="592" y2="264"/><line x1="718" y1="484" x2="718" y2="313"/>
<line x1="696" y1="378" x2="696" y2="207"/><line x1="822" y1="427" x2="822" y2="256"/>
<line x1="801" y1="321" x2="801" y2="150"/><line x1="927" y1="370" x2="927" y2="199"/>
<!-- engine -->
<polygon points="486,408 525,388 597,416 597,486 558,506 486,478" fill="#8a8a8a"/>
<polyline points="486,408 558,436 597,416 M558,436 558,506" stroke="#222"/>
<!-- operator -->
<circle cx="452" cy="362" r="9" fill="#f2d2b0"/>
<polyline points="460,376 474,441 438,447" stroke="#a33" stroke-width="3"/>
