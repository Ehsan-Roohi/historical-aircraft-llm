<line x1="578" y1="461" x2="566" y2="539"/><line x1="578" y1="461" x2="742" y2="443"/>
<ellipse cx="566" cy="539" rx="63" ry="118" transform="rotate(-12 566 539)" stroke="#1a5"/>
<ellipse cx="742" cy="443" rx="63" ry="118" transform="rotate(-12 742 443)" stroke="#1a5"/>
<!-- control run, schematic -->
<polyline points="285,461 483,404 906,591" stroke="#c60" stroke-dasharray="6 4"/>
<line x1="483" y1="404" x2="753" y2="206" stroke="#c60" stroke-dasharray="6 4"/>
<!-- upper deck and tip panels -->
<polygon points="154,486 320,551 952,207 786,142" fill="#e6c98a" fill-opacity="0.45"/>
<polygon points="154,486 320,551 402,506 236,441" fill="#c77" fill-opacity="0.5"/>
<polygon points="704,187 870,252 952,207 786,142" fill="#c77" fill-opacity="0.5"/>
<!-- left skid, wheels, strut -->
<polyline points="327,540 363,594 732,738" stroke="#6b4a2b" stroke-width="3"/>
<circle cx="390" cy="590" r="14"/><circle cx="642" cy="688" r="14"/>
<line x1="390" y1="590" x2="422" y2="542" stroke="#777"/>
<!-- centre of mass -->
<circle cx="519" cy="447" r="7" fill="#fff" stroke="#000"/>
<path d="M512,447h14M519,440v14" stroke="#000"/>
<!-- axis triad -->
<path d="M110,560l45,17M110,560l28,-15M110,560v-50" stroke="#000"/>
</g>
<g font-size="12" fill="#222">
<text x="158" y="580">x aft</text><text x="140" y="540">y right</text><text x="96" y="505">z up</text>
<text x="700" y="128">UPPER DECK 11.5 m × 1.85 m</text>
<text x="210" y="770">LOWER DECK (gap 1.85 m)</text>
<text x="140" y="430">tip panel ±8°</text><text x="880" y="180">tip panel</text>
<text x="380" y="340">operator (seated, x 0.15–0.85)</text>
<text x="600" y="500">engine 105 kg</text>
<text x="620" y="660">screw 2.3 m dia (two, x=2.6)</text>
<text x="900" y="700">tail plane 3.4 × 1.0 m, hinge x=5.4</text>
<text x="1000" y="510">fin + rudder</text>
<text x="240" y="820">ash skids, y=±1.2</text>
<text x="545" y="440">CoM</text>
<text x="380" y="240">body frame lattice x 0–6.6</text>
<text x="880" y="230" fill="#1a5">screws SCHEMATIC ellipses</text>
</g>
<g font-size="12">
<rect x="20" y="700" width="560" height="185" fill="#fff" stroke="#999"/>
<text x="30" y="718" font-weight="bold">Legend and notes (coordinates from §7 table, metres; screen = (420+90x+55y, 480+35x−30y−100z))</text>
<text x="30" y="738"><tspan fill="#b8862d">■</tspan> decks (translucent) <tspan fill="#c77">■</tspan> pivoted tip panels, outer 1.5 m of upper deck <tspan fill="#888">■</tspan> engine</text>
<text x="30" y="758"><tspan fill="#a33">—</tspan> operator <tspan fill="#6b4a2b">—</tspan> skids/wheels <tspan fill="#1a5">○</tspan> screw discs <tspan fill="#c60">- -</tspan> control run, SCHEMATIC (y unknown)</text>
<text x="30" y="780">Decks, posts, tip panels drawn SHIFTED +0.55 m aft per §9 audit (LE at x=0.55); table values unshifted.</text>
<text x="30" y="798">CoM drawn at x≈1.1 (≈0.30c after shift, §9); table gives x≈0.56 in old frame — CONTRADICTION left visible.</text>
<text x="30" y="816">Wheels: text says three, table gives x=0.40 and 3.20 on both skids (four) — UNKNOWN; four drawn.</text>
<text x="30" y="834">Posts: "six pairs", "six bays" — stations at y=±1.9, ±3.8, ±5.7 assumed; wires omitted. Arc thickness not shown.</text>
<text x="30" y="852">Screw rotation sense (opposite) not drawn. Ribbon on forward stay omitted. Nothing measured; all masses [A].</text>
<text x="30" y="872" fill="#666">Paper design, 31 Dec 1898 — SCHEMATIC, not to be scaled for construction.</text>
</g>
</svg>