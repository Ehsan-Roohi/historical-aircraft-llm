    <path d="M-.08 .57L.10 .10" fill="none" stroke-width=".05"/>
  </g>

  <!-- Hand linkage, pedals and cables: schematic, explicitly not fabrication routes -->
  <g stroke="#137b95" stroke-width="1.4" fill="none" stroke-dasharray="4 3">
    <path d="M642 363L647 346 M650 395L657 387 M647 375L582 354L493 317L419 279"/>
    <path d="M647 346L673 314"/>
  </g>

  <!-- Unknown-y equipment in amber y=0 reference plane only -->
  <g transform="matrix(57 24 0 -65 610 365)" fill="none" stroke="#be7621">
    <path d="M-3.82 -1.75L-3.70 -1.80L-3.58 -1.75 M1.88 -1.60L2 -1.65L2.12 -1.60" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
    <rect x="-.61" y="-.37" width=".18" height=".14" stroke-width="1.2" stroke-dasharray="3 2" vector-effect="non-scaling-stroke"/>
    <path d="M-.83 -.45H-.24" stroke-width="1.4" stroke-dasharray="3 2" vector-effect="non-scaling-stroke"/>
    <path d="M2.05 .88V1.08L2.17 1.01L2.05 .97 M2.05 1L2.31 .92L2.43 .96" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
  </g>

  <!-- Datum and CG -->
  <g stroke="#be7621" stroke-width="1.4" fill="white">
    <circle cx="610" cy="342.25" r="5"/>
    <path d="M602 342.25H618 M610 334.25V350.25" fill="none"/>
