" y="437" font-size="21" font-weight="bold">5 · S</text><text x="20" y="462" font-size="20">Drive shaft and guard</text></g><g aria-label="Operator and seat"><path d="M540 562V520L613 346" fill="none" stroke="#445c6b" stroke-width="1.7"/><circle cx="595" cy="349" r="15" fill="white" stroke="#152b38" stroke-width="2"/><text x="595" y="355" text-anchor="middle" font-size="18" font-weight="bold">6</text><text x="465" y="589" font-size="21" font-weight="bold">6 · O</text><text x="465" y="614" font-size="20">Operator and seat</text></g><g aria-label="Motor and cooling"><path d="M954 436H897L707 407" fill="none" stroke="#445c6b" stroke-width="1.7"/><circle cx="696" cy="425" r="15" fill="white" stroke="#152b38" stroke-width="2"/><text x="696" y="431" text-anchor="middle" font-size="18" font-weight="bold">7</text><text x="950" y="419" font-size="21" font-weight="bold">7 · M</text><text x="950" y="444" font-size="20">Motor and cooling</text></g><g aria-label="Wheels"><path d="M799 532H703L591 507" fill="none" stroke="#445c6b" stroke-width="1.7"/><circle cx="620" cy="493" r="15" fill="white" stroke="#152b38" stroke-width="2"/><text x="620" y="499" text-anchor="middle" font-size="18" font-weight="bold">8</text><text x="785" y="554" font-size="21" font-weight="bold">8 · W</text><text x="785" y="579" font-size="20">Wheels</text></g><path d="M20 619H1180" stroke="#9ba9b0"/><text x="20" y="649" font-size="19">Dashed brown prism: truss envelope, not resolved structural members.</text><text x="20" y="678" font-size="19">Schematic V0 proposal; unknown placement and interfaces remain unresolved.</text></g></svg>