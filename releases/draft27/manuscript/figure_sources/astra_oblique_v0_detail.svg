  <g transform="matrix(57 24 0 -65 651.8 343)">
    <circle cx=".4" cy="-1.5" r=".3" fill="#f1f3f3" stroke="#28353d" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <circle cx=".4" cy="-1.5" r=".035" fill="#28353d"/>
