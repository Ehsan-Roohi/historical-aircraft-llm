<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Astra V0 geometry with named component callouts"><rect width="1200" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#172936"><text x="20" y="32" font-size="24" font-weight="bold">Astra V0 — component geometry</text></g>  <!-- Mapping: u=610+57x+38y; v=365+24x-20y-65z -->
