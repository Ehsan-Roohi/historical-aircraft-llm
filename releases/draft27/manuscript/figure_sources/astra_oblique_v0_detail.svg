    <rect x="-4.1" y=".1" width="1" height="1.2" fill="#fff0d8" fill-opacity=".58" stroke="#be7621" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
    <path d="M-3.35 .1V1.3" fill="none" stroke="#be7621" stroke-width="1.3" stroke-dasharray="5 3" vector-effect="non-scaling-stroke"/>
  </g>

  <!-- Propeller swept disk in yz plane; blades deliberately unspecified -->
  <g transform="matrix(38 -20 0 -65 347.8 274.1)">
    <circle r="1.2" fill="#f0e8f4" fill-opacity=".20" stroke="#733f82" stroke-width="1.8" stroke-dasharray="7 4" vector-effect="non-scaling-stroke"/>
